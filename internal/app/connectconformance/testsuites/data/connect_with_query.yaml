name: Connect with QUERY
# These cases use the HTTP QUERY method (RFC 10008) for a side-effect-free unary
# RPC. The request is a unary POST request with only the method changed. When
# testing a client, the reference server verifies that the method really is
# QUERY. When testing a server, the reference client sends QUERY and the
# server must report the method it observed.
relevantProtocols:
  - PROTOCOL_CONNECT
relies_on_connect_query: true
testCases:
- request:
    testName: success
    service: connectrpc.conformance.v1.ConformanceService
    method: IdempotentUnary
    streamType: STREAM_TYPE_UNARY
    useQueryHttpMethod: true
    requestHeaders:
    - name: X-Conformance-Test
      value: ["Value1","Value2"]
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
      responseDefinition:
        responseHeaders:
        - name: x-custom-header
          value: ["foo"]
        responseData: "dGVzdCByZXNwb25zZQ=="
        responseTrailers:
        - name: x-custom-trailer
          value: ["bing"]
# A zero-length body is a valid message, as it is for POST. With the proto codec
# this request is encoded as an empty body.
- request:
    testName: empty-message
    service: connectrpc.conformance.v1.ConformanceService
    method: IdempotentUnary
    streamType: STREAM_TYPE_UNARY
    useQueryHttpMethod: true
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
- request:
    testName: large-message
    service: connectrpc.conformance.v1.ConformanceService
    method: IdempotentUnary
    streamType: STREAM_TYPE_UNARY
    useQueryHttpMethod: true
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
      responseDefinition:
        responseData: "dGVzdCByZXNwb25zZQ=="
      # 9000 bytes, which is more than fits in a typical GET URL.
      requestData: ""
- request:
    testName: error
    service: connectrpc.conformance.v1.ConformanceService
    method: IdempotentUnary
    streamType: STREAM_TYPE_UNARY
    useQueryHttpMethod: true
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
      responseDefinition:
        responseHeaders:
        - name: x-custom-header
          value: ["foo"]
        error:
          code: CODE_INVALID_ARGUMENT
          message: "invalid argument"
        responseTrailers:
        - name: x-custom-trailer
          value: ["bing"]
- request:
    testName: error-not-found
    service: connectrpc.conformance.v1.ConformanceService
    method: IdempotentUnary
    streamType: STREAM_TYPE_UNARY
    useQueryHttpMethod: true
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
      responseDefinition:
        error:
          code: CODE_NOT_FOUND
          message: "not found"
# The timeout is sent as a header, as it is for POST.
- request:
    testName: timeout-propagated
    service: connectrpc.conformance.v1.ConformanceService
    method: IdempotentUnary
    streamType: STREAM_TYPE_UNARY
    useQueryHttpMethod: true
    timeoutMs: 5000
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
      responseDefinition:
        responseData: "dGVzdCByZXNwb25zZQ=="
# See the note in timeouts.yaml about the response delay.
- request:
    testName: timeout-exceeded
    service: connectrpc.conformance.v1.ConformanceService
    method: IdempotentUnary
    streamType: STREAM_TYPE_UNARY
    useQueryHttpMethod: true
    timeoutMs: 200
    requestMessages:
    - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
      responseDefinition:
        responseData: "dGVzdCByZXNwb25zZQ=="
        responseDelayMs: 1500
  expectedResponse:
    error:
      code: CODE_DEADLINE_EXCEEDED
